# Production deploys via Vercel Git integration (connected to this repo).
# Set env vars in the Vercel project dashboard:
#   OPINLY_API_KEY, OPINLY_CDN_NAMESPACE, OPINLY_WEBHOOK_SECRET
#   NEXT_PUBLIC_GTM_ID, NEXT_PUBLIC_AIRTABLE_*, NEXT_PUBLIC_FIREBASE_*
#
# Optional: push-triggered deploy with a Vercel token if Git integration is not used.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./
